# Tool catalog for the browser UI. Scripts stay the QGIS Processing engines.
# algorithm_id is the qgis_process id (script:name).

tabs:
  - id: trees
    label: Trees
    icon: park
  - id: buildings
    label: Buildings
    icon: apartment
  - id: roads
    label: Roads
    icon: route
  - id: water
    label: Water
    icon: water_drop
  - id: common
    label: Common
    icon: hub

# Maps under Database/<map_id>/…
maps:
  - id: Fort_Riley
    label: Fort Riley
  - id: Nablus
    label: Nablus
  - id: GFK
    label: GFK

# Domain roots under each map.
# source_domains get source/staging/tests/final; others only staging/tests/final.
domains:
  buildings_footprints: buildings/footprints
  buildings_zones: buildings/zones
  trees_footprints: trees/footprints
  trees_points: trees/points
  roads_vectors: roads/vectors
  roads_masks: roads/masks
  roads_outline_points: roads/outline_points
  roads_mesh_3d: roads/mesh_3d
  roads_clip_polygons: roads/clip_polygons
  water_footprints: water/footprints
  water_outline_points: water/outline_points
  quantized_mesh: elevation/quantized-mesh
  dtm: elevation/DTM
  imagery: imagery

# Friendly names for Order-stage ports (domain / library file types).
domain_labels:
  buildings_footprints: Buildings footprints
  buildings_zones: Buildings zones
  trees_footprints: Tree footprints
  trees_points: Tree points
  roads_vectors: Roads vectors
  roads_masks: Roads masks
  roads_outline_points: Roads outline points
  roads_mesh_3d: Roads 3D mesh
  roads_clip_polygons: Road ground clips
  water_footprints: Water footprints
  water_outline_points: Water outline points
  quantized_mesh: Quantized mesh
  dtm: DTM
  imagery: Imagery

# Immutable imports — only these domains create a source/ tier.
source_domains:
  - buildings_footprints
  - trees_footprints
  - roads_vectors
  - roads_mesh_3d
  - water_footprints
  - quantized_mesh
  - dtm
  - imagery

tiers: [source, staging, tests, final]
# Input pickers scan in this order (final = best finished product).
input_tiers: [final, staging, source, tests]

# Hardcoded chains (also mirrored in flow_graph._WIRE_CHAINS).
# Selected tools in a chain run upstream→downstream; skipped tools bridge only
# when the parent output domain matches the child input library exactly.
pipelines:
  - id: alignment_water
    label: Layers → Water
    steps:
      - id: layers_alignment
      - id: water_outline_points
  - id: alignment_trees
    label: Layers → Trees
    steps:
      - id: layers_alignment
      - id: tree_mask_to_points
      - id: thin_tree_points
      - id: sample_tree_rgb
  - id: alignment_buildings
    label: Layers → Buildings
    steps:
      - id: layers_alignment
      - id: building_altitude_and_height
      - id: assign_roof_type
  - id: roads
    label: Roads
    steps:
      - id: polygon_mask_points

tools:
  - id: tree_mask_to_points
    algorithm: script:tree_mask_to_points
    display_name: Trees mask to points
    tabs: [trees]
    description: Place spaced PointZ samples inside tree footprints.
    params:
      - id: INPUT_POLYGONS
        label: Tree footprints
        type: vector_file
        library: trees_footprints
        required: true
      - id: INPUT_MESH
        label: Quantized-mesh (highest LOD)
        type: folder
        library: quantized_mesh
        mesh_pick: lod
        required: true
      - id: MIN_DISTANCE
        label: Minimum distance between points (m)
        type: number
        default: 1.5
        min: 0.01
      - id: WORKERS
        label: Worker processes (0=auto, 1=serial)
        type: integer
        default: 0
        min: 0
      - id: OUTPUT
        label: Spaced tree points
        type: vector_output
        domain: trees_points
        default_tier: staging
        default_name: tree_points.shp
        required: true

  - id: thin_tree_points
    algorithm: script:thin_tree_points
    display_name: Trees thinning
    tabs: [trees]
    description: Keep a random fraction of tree points (input not overwritten).
    params:
      - id: INPUT_POINTS
        label: Tree points
        type: vector_file
        library: trees_points
        required: true
      - id: KEEP_FRACTION
        label: Keep fraction (0–1)
        type: number
        default: 0.4
        min: 0.0
        max: 1.0
      - id: SEED
        label: Random seed (-1 = none)
        type: integer
        default: 42
      - id: OUTPUT
        label: Thinned tree points
        type: vector_output
        domain: trees_points
        default_tier: staging
        default_name: tree_points_thinned.shp
        required: true

  - id: sample_tree_rgb
    algorithm: script:sample_tree_rgb
    display_name: Trees RGB
    tabs: [trees]
    description: Sample R/G/B from imagery and attach to tree points.
    params:
      - id: INPUT_POINTS
        label: Tree points
        type: vector_file
        library: trees_points
        required: true
      - id: INPUT_FOLDER
        label: Imagery folder (TIFF)
        type: folder
        library: imagery
        required: true
      - id: OUTPUT
        label: Trees with RGB
        type: vector_output
        domain: trees_points
        default_tier: final
        default_name: tree_points_rgb.shp
        required: true

  - id: building_altitude_and_height
    algorithm: script:building_altitude_and_height
    display_name: Buildings altitude and height
    tabs: [buildings]
    description: Add altitude, max_altitude, and random height from mesh.
    params:
      - id: INPUT_BUILDINGS
        label: Buildings footprints
        type: vector_file
        library: buildings_footprints
        required: true
      - id: INPUT_MESH
        label: Quantized-mesh (highest LOD)
        type: folder
        library: quantized_mesh
        mesh_pick: lod
        required: true
      - id: MIN_VALUE
        label: Minimum random height component
        type: number
        default: 0.0
      - id: MAX_VALUE
        label: Maximum random height component
        type: number
        default: 1.0
      - id: SEED
        label: Random seed (-1 = none)
        type: integer
        default: -1
      - id: WORKERS
        label: Worker processes (0=auto, 1=serial)
        type: integer
        default: 0
        min: 0
      - id: OUTPUT
        label: Buildings with altitude and height
        type: vector_output
        domain: buildings_footprints
        default_tier: staging
        default_name: buildings_altitude.shp
        required: true

  - id: assign_roof_type
    algorithm: script:assign_roof_type
    display_name: Buildings roof types
    tabs: [buildings]
    description: Assign roof_type from zone polygons.
    params:
      - id: INPUT_BUILDINGS
        label: Buildings footprints
        type: vector_file
        library: buildings_footprints
        required: true
      - id: INPUT_ZONES
        label: Roof type zones
        type: vector_file
        library: buildings_zones
        required: true
      - id: SEED
        label: Random seed (-1 = none)
        type: integer
        default: 42
      - id: OUTPUT
        label: Buildings with roof_type
        type: vector_output
        domain: buildings_footprints
        default_tier: final
        default_name: buildings_roof_type.shp
        required: true

  - id: polygon_mask_points
    algorithm: script:polygon_mask_points
    display_name: Roads mask to outline points
    tabs: [roads]
    description: >
      Densify road-mask outlines to PointZ samples with mesh altitude
      (same engine as water outline points).
    params:
      - id: INPUT_POLYGONS
        label: Road mask polygons
        type: vector_file
        library: roads_masks
        required: true
      - id: INPUT_MESH
        label: Quantized-mesh (highest LOD)
        type: folder
        library: quantized_mesh
        mesh_pick: lod
        required: true
      - id: SPACING
        label: Outline point spacing (m)
        type: number
        default: 5.0
        min: 0.01
      - id: ADD_CENTER_POINTS
        label: Add center points (legacy)
        type: boolean
        default: false
      - id: CENTER_MODE
        label: Center point mode (legacy)
        type: enum
        options: ["Sparse grid (legacy)", "Chord midpoints (legacy)"]
        default: 0
      - id: CENTER_GRID_SPACING
        label: Center grid spacing (m, legacy)
        type: number
        default: 5.0
        min: 0.01
      - id: WORKERS
        label: Worker processes (0=auto, 1=serial)
        type: integer
        default: 0
        min: 0
      - id: OUTPUT
        label: Outline points with altitude
        type: vector_output
        domain: roads_outline_points
        default_tier: final
        default_name: road_outline_points.shp
        required: true

  - id: burn_roads_into_quantized_mesh
    algorithm: script:burn_roads_into_quantized_mesh
    display_name: Push QM under 3D roads (poke-through only)
    tabs: [roads]
    description: >
      Lower quantized-mesh vertices that poke through a Unreal 3D road mesh
      (all LODs). At each in-mask vertex not on a straddling QM triangle:
      target = road plane Z − clearance; new = min(old, target). Rim vertices
      on triangles that also have an outside corner are never lowered.
    params:
      - id: INPUT_ROADS
        label: Roads 3D mesh (triangles with Z)
        type: vector_file
        library: roads_mesh_3d
        required: true
      - id: INPUT_MESH
        label: Quantized-mesh tileset
        type: folder
        library: quantized_mesh
        mesh_pick: tileset
        required: true
      - id: OFFSET_DOWN
        label: Under-road clearance (m)
        type: number
        default: 0.05
        min: 0.0
      - id: OUTPUT_MESH
        label: Output quantized-mesh tileset
        type: folder_output
        domain: quantized_mesh
        default_tier: final
        default_name: mesh_roads_burned
        required: true

  - id: road_ground_clip_polygons
    algorithm: script:road_ground_clip_polygons
    display_name: Road ground clip polygons
    tabs: [roads]
    description: >
      Polygons where the quantized mesh rises above the 3D road surface.
      With simplification on, each patch becomes a road-aligned rectangle
      when that fits inside the road mask. Otherwise the rectangle is cut
      to the mask and extra corners are removed. Nearby patches merge when
      one simpler shape covers both. Turn simplification off to keep the
      exact bumps, or also save those exact polygons beside the simplified ones.
    params:
      - id: INPUT_ROADS
        label: Roads 3D mesh (triangles with Z)
        type: vector_file
        library: roads_mesh_3d
        required: true
      - id: INPUT_MASK
        label: Road mask (clip stays inside)
        type: vector_file
        library: roads_masks
        required: true
      - id: INPUT_MESH
        label: Quantized-mesh (highest LOD)
        type: folder
        library: quantized_mesh
        mesh_pick: lod
        required: true
      - id: MIN_PROTRUSION
        label: Minimum protrusion (m)
        type: number
        default: 0.02
        min: 0.0
      - id: BUFFER
        label: Buffer inside the road (m)
        type: number
        default: 1.0
        min: 0.0
      - id: MERGE_GAP
        label: Merge bumps up to this far apart (m)
        type: number
        default: 100.0
        min: 0.0
        enabled_by: LOW_VERTEX
      - id: LOW_VERTEX
        label: Simplify clip polygons
        type: boolean
        default: true
      - id: WRITE_EXACT
        label: Also save exact bump polygons
        type: boolean
        default: false
      - id: MIN_AREA
        label: Minimum polygon area (m²)
        type: number
        default: 0.25
        min: 0.0
      - id: LOD
        label: LOD (-1 = highest in the folder)
        type: integer
        default: -1
        min: -1
      - id: WORKERS
        label: Worker processes (0=auto, 1=serial)
        type: integer
        default: 0
        min: 0
      - id: OUTPUT
        label: Road ground clip polygons
        type: vector_output
        domain: roads_clip_polygons
        default_tier: final
        default_name: road_ground_clips.shp
        required: true
      - id: OUTPUT_EXACT
        label: Exact bump polygons
        type: vector_output
        domain: roads_clip_polygons
        default_tier: final
        default_name: road_ground_bumps_exact.shp
        required: false
        enabled_by: WRITE_EXACT

  - id: water_outline_points
    algorithm: script:polygon_mask_points
    display_name: Water mask to outline points
    tabs: [water]
    description: >
      Densify water-mask outlines to PointZ samples with mesh altitude
      (same engine as road outline points).
    params:
      - id: INPUT_POLYGONS
        label: Water mask polygons
        type: vector_file
        library: water_footprints
        required: true
      - id: INPUT_MESH
        label: Quantized-mesh (highest LOD)
        type: folder
        library: quantized_mesh
        mesh_pick: lod
        required: true
      - id: SPACING
        label: Outline point spacing (m)
        type: number
        default: 5.0
        min: 0.01
      - id: ADD_CENTER_POINTS
        label: Add center points (legacy)
        type: boolean
        default: false
      - id: CENTER_MODE
        label: Center point mode (legacy)
        type: enum
        options: ["Sparse grid (legacy)", "Chord midpoints (legacy)"]
        default: 0
      - id: CENTER_GRID_SPACING
        label: Center grid spacing (m, legacy)
        type: number
        default: 5.0
        min: 0.01
      - id: WORKERS
        label: Worker processes (0=auto, 1=serial)
        type: integer
        default: 0
        min: 0
      - id: OUTPUT
        label: Outline points with altitude
        type: vector_output
        domain: water_outline_points
        default_tier: final
        default_name: water_outline_points.shp
        required: true

  - id: layers_alignment
    algorithm: script:layers_alignment
    display_name: Layers alignment
    tabs: [common]
    description: >
      Remove overlaps by priority (roads → water → buildings → trees):
      cut water on roads, buildings on roads/water, and trees on roads/water/buildings.
      Trees may be footprints or points. Roads are unchanged.
    params:
      - id: INPUT_ROADS
        label: Roads masks
        type: vector_file
        library: roads_masks
        required: true
      - id: INPUT_WATER
        label: Water footprints
        type: vector_file
        library: water_footprints
        required: true
      - id: INPUT_BUILDINGS
        label: Buildings footprints
        type: vector_file
        library: buildings_footprints
        required: true
      - id: INPUT_TREES
        label: Trees (footprints or points)
        type: vector_file
        library: trees_footprints
        required: true
      - id: CLEARANCE
        label: Clearance buffer (m)
        type: number
        default: 1.0
        min: 0.0
      - id: OUTPUT_WATER
        label: Aligned water
        type: vector_output
        domain: water_footprints
        default_tier: staging
        default_name: water_aligned.shp
        required: true
      - id: OUTPUT_TREES
        label: Aligned trees
        type: vector_output
        domain: trees_footprints
        default_tier: staging
        default_name: trees_aligned.shp
        required: true
      - id: OUTPUT_BUILDINGS
        label: Aligned buildings
        type: vector_output
        domain: buildings_footprints
        default_tier: staging
        default_name: buildings_aligned.shp
        required: true
